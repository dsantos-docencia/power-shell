name: "🐛 Erro / Bug"
description: Algo está errado — um exemplo que não roda, um erro no texto, um link quebrado.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Obrigado por ajudar a melhorar o curso! Quanto mais específico, mais rápido a gente corrige."
  - type: input
    id: onde
    attributes:
      label: Onde está o problema?
      description: Caminho do arquivo ou módulo (ex.> modulos/02-pipeline-objetos/exemplos/01-pipeline.ps1)
      placeholder: "modulos/.../arquivo.ps1"
    validations:
      required: true
  - type: textarea
    id: descricao
    attributes:
      label: O que aconteceu?
      description: Descreva o erro. Se for um script, cole a saída/mensagem de erro.
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: O que você esperava?
    validations:
      required: false
  - type: input
    id: ambiente
    attributes:
      label: Ambiente
      description: Versão do PowerShell ($PSVersionTable) e SO (Windows/Linux/macOS).
      placeholder: "PowerShell 7.4 · Windows 11"
    validations:
      required: false
