name: "📜 Enviar um script para a comunidade"
description: Tem um script PowerShell legal? Compartilhe! A gente avalia e, se fizer sentido, inclui no catálogo da comunidade com seu crédito.
title: "[script] "
labels: ["script-da-comunidade"]
body:
  - type: markdown
    attributes:
      value: |
        **Não deixe o conhecimento morrer com você.** 🌱
        Compartilhe aquele script útil que você escreveu. Vamos avaliar juntos, comentar, e — se fizer sentido — incluí-lo em [`scripts/comunidade/`](https://github.com/dsantos-docencia/power-shell/tree/main/scripts/comunidade) **com o seu crédito**.
  - type: input
    id: nome
    attributes:
      label: Nome do script e o que ele faz (em uma linha)
      placeholder: "Get-DiskReport.ps1 — relatório de uso de disco por pasta"
    validations:
      required: true
  - type: textarea
    id: problema
    attributes:
      label: Que problema ele resolve?
      description: Conte a história — em que situação real ele te ajudou.
    validations:
      required: true
  - type: dropdown
    id: plataforma
    attributes:
      label: Onde ele roda?
      options:
        - Windows PowerShell 5.1
        - PowerShell 7+ (multiplataforma)
        - Ambos
    validations:
      required: true
  - type: textarea
    id: codigo
    attributes:
      label: O script (ou link)
      description: Cole o código aqui (entre ```powershell … ```), ou o link para um gist/repositório.
      render: powershell
    validations:
      required: true
  - type: input
    id: credito
    attributes:
      label: Como você quer ser creditado?
      placeholder: "Seu Nome (@seu-usuario)"
    validations:
      required: true
  - type: checkboxes
    id: aceite
    attributes:
      label: Antes de enviar
      options:
        - label: "O script é meu (ou tenho direito de compartilhá-lo) e aceito publicá-lo sob as licenças do projeto (PolyForm Noncommercial, uso não comercial)."
          required: true
        - label: "Removi segredos, senhas, tokens, credenciais e dados sensíveis do código."
          required: true
        - label: "Entendo que o mantenedor pode sugerir ajustes ou recusar, e que a inclusão é uma curadoria."
          required: true
